name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: ./.github/actions/setup

      - name: Build default CLI
        run: pnpm build

      - name: Build beau CLI
        run: pnpm build:beau

  build-binary:
    name: Build-binary (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: crank-linux-x64
            path: dist-sea/crank
          - os: ubuntu-24.04-arm
            artifact: crank-linux-arm64
            path: dist-sea/crank
          - os: macos-26
            artifact: crank-darwin-arm64
            path: dist-sea/crank
          - os: macos-15-intel
            artifact: crank-darwin-x64
            path: dist-sea/crank
          - os: windows-2022
            artifact: crank-win-x64
            path: dist-sea/crank.exe
    steps:
      - name: Checkout
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: ./.github/actions/setup

      - name: Build SEA binary
        run: pnpm build:sea

      - name: Upload SEA binary
        # actions/upload-artifact@v4.4.3
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: ./.github/actions/setup

      - name: Run tests
        run: pnpm test

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: ./.github/actions/setup

      - name: Run ESLint
        run: pnpm lint

  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: ./.github/actions/setup

      - name: Check formatting
        run: pnpm format:check
