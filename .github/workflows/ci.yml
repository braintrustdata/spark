name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: ./.github/actions/setup

      - name: Build CLIs
        run: pnpm build

  build-binary:
    name: Build binary (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: braintrust-setup-linux-x64
            ext: ""
            archive: tar.gz
          - os: ubuntu-24.04-arm
            artifact: braintrust-setup-linux-arm64
            ext: ""
            archive: tar.gz
          - os: macos-26
            artifact: braintrust-setup-darwin-arm64
            ext: ""
            archive: tar.gz
          - os: macos-15-intel
            artifact: braintrust-setup-darwin-x64
            ext: ""
            archive: tar.gz
          - os: windows-2022
            artifact: braintrust-setup-windows-x64
            ext: ".exe"
            archive: zip
          - os: windows-11-arm
            artifact: braintrust-setup-windows-arm64
            ext: ".exe"
            archive: zip
    steps:
      - name: Checkout
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/build-binary
        with:
          archive: ${{ matrix.archive }}
          artifact: ${{ matrix.artifact }}
          ext: ${{ matrix.ext }}

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: ./.github/actions/setup

      - name: Install Braintrust CLI
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/braintrustdata/bt/releases/latest/download/bt-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run tests
        env:
          BRAINTRUST_SERVICE_TOKEN: ${{ secrets.BRAINTRUST_SERVICE_TOKEN }}
        run: pnpm test

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: ./.github/actions/setup

      - name: Run ESLint
        run: pnpm lint

  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: ./.github/actions/setup

      - name: Check formatting
        run: pnpm format:check
