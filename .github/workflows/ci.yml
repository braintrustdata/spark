name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up mise
        # jdx/mise-action@v4.0.1
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151
        with:
          cache: true
          install: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build default CLI
        run: pnpm build

      - name: Build beau CLI
        run: pnpm build:beau

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up mise
        # jdx/mise-action@v4.0.1
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151
        with:
          cache: true
          install: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up mise
        # jdx/mise-action@v4.0.1
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151
        with:
          cache: true
          install: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up mise
        # jdx/mise-action@v4.0.1
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151
        with:
          cache: true
          install: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check
