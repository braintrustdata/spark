name: Build binaries

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-binary:
    name: Build-binary (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: spark-linux-x64
            ext: ""
          - os: ubuntu-24.04-arm
            artifact: spark-linux-arm64
            ext: ""
          - os: macos-26
            artifact: spark-darwin-arm64
            ext: ""
          - os: macos-15-intel
            artifact: spark-darwin-x64
            ext: ""
          - os: windows-2022
            artifact: spark-win-x64
            ext: ".exe"
          - os: windows-11-arm
            artifact: spark-win-arm64
            ext: ".exe"
    steps:
      - name: Checkout
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: ./.github/actions/setup

      - name: Build SEA binary
        run: pnpm build:sea

      - name: Rename binary to asset name
        shell: bash
        run: mv "dist-sea/spark${{ matrix.ext }}" "dist-sea/${{ matrix.artifact }}${{ matrix.ext }}"

      - name: Upload SEA binary
        # actions/upload-artifact@v4.4.3
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: ${{ matrix.artifact }}
          path: dist-sea/${{ matrix.artifact }}${{ matrix.ext }}
          if-no-files-found: error
